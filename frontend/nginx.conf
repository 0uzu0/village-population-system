server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传附件：用户要求不限制大小，故 client_max_body_size 设为 0（nginx 中表示无上限）。
    # 真正约束转为磁盘空间与代理超时；类型白名单（见后端 file.ts）仍保留，挡住非 PDF/图片上传。
    client_max_body_size 0;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API 反向代理（后端服务名在 docker-compose 中为 backend）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 万行级 Excel 导入为同步处理，超时放宽到 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 入口 HTML 不做缓存，交给浏览器每次校验（没变就是 304，代价极小）。
    #
    # 构建产物是内容哈希文件名（assets/index-<hash>.js），内容一变文件名就变，
    # 所以「新版本有没有生效」完全取决于用户手里是哪一份 index.html。
    # 它一旦被浏览器或 NAS 外层反向代理缓存住，用户会一直看到旧版本——
    # 表现就是「新功能没上线」「某个页签不见了」，而服务端其实早就更新了。
    #
    # 这里只用 expires 不用 add_header：location 里一旦出现 add_header，
    # server 级的三个安全响应头就不再向下继承，会被静默丢掉。
    location = /index.html {
        expires -1;
    }

    # 静态资源：文件名带内容哈希，可以放心长缓存
    location /assets/ {
        # 同理只写 add_header（不再叠 expires，否则 nginx 会同时输出两个
        # Cache-Control 头）。代价是本 location 不再继承 server 级安全头，
        # 因此把 nosniff 补回来——JS/CSS 被嗅探成别的类型是有实际风险的。
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
