name: docker-publish

# =============================================================
# 精简版流水线（两段）：
#   1) build        —— 前后端安装、单元测试、类型检查与构建（PR / push 均执行）
#   2) docker       —— 构建并推送镜像到 GHCR（仅 main 分支、版本标签、手动触发）
#
# 触发条件：
#   - push 到 main：发布 latest + sha-<短哈希>
#   - push v* 标签：额外发布语义化版本标签
#   - Pull Request：只做校验，不发布镜像
#   - workflow_dispatch：手动触发
#
# 精简说明（相对旧版移除的部分）：
#   - 移除 linux/arm64 多架构与 QEMU：单架构 amd64，构建时间从十几分钟降到几分钟
#   - 移除 Trivy 漏洞扫描：第三方 action 版本易失效，且仅为告警性质
#   - 移除 sbom / provenance 证明：单架构下无需镜像索引附加清单
#   - 移除 workflow 级 env 与短 SHA 计算步骤（Trivy 移除后不再需要）
#   - 移除 GitHub Actions 缓存（type=gha）：偶发 not_found 导致构建失败
# =============================================================
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只申请必要权限：读源码 + 写 GHCR 包
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------
  # 1) 校验：安装依赖、跑测试、类型检查与构建
  # ---------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 后端安装与测试
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run build

      - name: 前端安装与构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------
  # 2) 发布：构建并推送镜像到 GHCR（amd64）
  # ---------------------------------------------------------
  docker:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（使用 GITHUB_TOKEN，无需长期 PAT）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 说明：此处刻意不使用 GitHub Actions 缓存（cache-from/cache-to: type=gha）。
          # 该缓存后端偶发 "error writing layer blob: not_found" 导致构建失败，
          # 收益（省几十秒）小于稳定性风险；如需加速可改用 type=registry 缓存。
