# 构建 JVM 参数。容器/CI 上内存有限，给太大反而会被 OOM Killer 干掉。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 并行 + 构建缓存：本工程只有 app 一个模块，收益有限但无害
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（必开，否则所有 androidx.* 依赖都解析不到）
android.useAndroidX=true

# 非传递 R 类：每个模块只生成自己的 R，能显著减少编译期符号量
android.nonTransitiveRClass=true

kotlin.code.style=official
