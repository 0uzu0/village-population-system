# =============================================================
# 村级人口管理系统 - 生产部署（Docker Compose）
# 使用已发布的 GHCR 镜像；版本通过环境变量配置
# 使用前：cp .env.example .env 并填写真实值
# =============================================================
name: village-population

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/REPO-frontend}:${VERSION:-latest}
    container_name: vp-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/REPO-backend}:${VERSION:-latest}
    container_name: vp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-village_population}
      DB_USER: ${MYSQL_USER:-village}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      ADMIN_INIT_NAME: ${ADMIN_INIT_NAME:-系统管理员}
      UPLOAD_DIR: /app/uploads
    volumes:
      # 「绑到宿主机目录」而不是 docker named volume —— 附件（现场照片、合同扫描件）
      # 是这套系统里**唯一不能靠重新部署恢复的东西**：数据库有迁移和备份，
      # 代码有镜像，而照片丢了就是丢了。
      # named volume 的文件藏在 /var/lib/docker/volumes/... 里，root 权限、哈希目录名，
      # 想用文件管理器看一眼或 rsync 到 NAS 都得先想半天路径；
      # 绑到宿主机目录后，备份就是 cp/tar/rsync 一个普通文件夹，也能直接在网页端看不到时
      # 手动翻目录确认照片在不在。默认落在 deploy/data/uploads，可用 UPLOAD_DIR_HOST 改。
      - ${UPLOAD_DIR_HOST:-./data/uploads}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  mysql:
    image: mysql:8.0
    container_name: vp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-village_population}
      MYSQL_USER: ${MYSQL_USER:-village}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql   # 持久化数据卷，勿删
    networks:
      - internal          # 数据库仅内部网络开放，不对外暴露端口
    healthcheck:
      # 不带 -p 密码：mysqladmin ping 只需探测服务端口是否响应（收到 Access denied
      # 也算存活，退出码为 0），既不泄露密码（docker inspect 可见），也不会因
      # .env 密码改过/特殊字符导致误报 unhealthy 卡死 backend 启动
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 首次初始化在 NAS 机械盘/慢速存储上可能超过 30s，放宽避免误判
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  mysql_data:      # 数据库持久化卷
  # 附件不再用 named volume：已改为绑到宿主机目录（见 backend.volumes 的说明）。
  # 老部署如果已有 uploads_data 卷，按 README「从 named volume 迁到宿主机目录」一节搬一次。

networks:
  web:             # 对外网络（仅 frontend 暴露端口）
  internal:        # 内部网络（mysql 与 backend 互通，不对外）
